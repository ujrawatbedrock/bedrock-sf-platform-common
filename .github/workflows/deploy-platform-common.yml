name: Deploy Platform Common

on:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  deploy:
    name: Deploy Core Frameworks & Data Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Custom NPM Global Directory
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix '~/.npm-global'
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Cache SF CLI & Plugins
        uses: actions/cache@v4
        id: sf-cli-cache
        with:
          path: |
            ~/.npm-global
            ~/.local/share/sf
          key: sf-cli-plugins-v2

      - name: Install Salesforce CLI & Plugins
        if: steps.sf-cli-cache.outputs.cache-hit != 'true'
        run: |
          npm install -g @salesforce/cli
          echo y | sf plugins install sfdx-git-delta

      - name: Auth to Target Org
        run: |
          echo "${{ secrets.SFDX_AUTH_INT }}" > sfdx-auth.txt
          sf org login sfdx-url --sfdx-url-file sfdx-auth.txt --alias target-org --set-default
          rm sfdx-auth.txt

      - name: Generate Delta Package
        run: |
          mkdir changed-sources
          sf sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source packages

      - name: Check for Deployable Metadata Changes
        id: check_changes
        run: |
          HAS_CHANGES=false
          if grep -q '<types>' changed-sources/package/package.xml 2>/dev/null; then HAS_CHANGES=true; fi
          if grep -q '<types>' changed-sources/destructiveChanges/destructiveChanges.xml 2>/dev/null; then HAS_CHANGES=true; fi
          
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          if [ "$HAS_CHANGES" = "false" ]; then
            echo "✅ No metadata changes detected. Skipping deployment."
          fi

      - name: Deploy metadata & Destructive Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          sf project deploy start \
            --manifest changed-sources/package/package.xml \
            --post-destructive-changes changed-sources/destructiveChanges/destructiveChanges.xml \
            --target-org target-org \
            --test-level RunLocalTests \
            --wait 30

      - name: Run Post-Deploy Health Check
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          sf apex run --file scripts/apex/post-deploy-smoke-check.apex --target-org target-org
